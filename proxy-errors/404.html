g-top:26px;display:flex;flex-wrap:wrap;gap:10px}.tag{display:inline-block;font-size:11px;color:var(--accent);border:1px solid #38605d;border-radius:5px;padding:2px 7px;margin-bottom:22px}.search{max-width:420px;margin:25px 0 30px}.empty{display:none;color:var(--muted)}footer{border-top:1px solid var(--line);margin-top:46px;padding-top:20px;color:var(--muted);font-size:13px}@media(max-width:600px){main{padding:25px 18px}.login{margin:45px auto}.card{padding:23px}}
