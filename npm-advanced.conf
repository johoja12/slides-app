# Example: replace slides.example.com and the upstream address for your deployment.
proxy_intercept_errors on;
proxy_ssl_server_name on;
proxy_ssl_name slides.example.com;
access_log off;
location /s/ {
    access_log off;
    error_log /dev/null crit;
    proxy_ssl_server_name on;
    proxy_ssl_name slides.example.com;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass https://127.0.0.1:8447;
}

error_page 400 =400 @slides_error_400;
location @slides_error_400 {
    root /data/slides-errors;
    try_files /400.html =400;
    access_log off;
    error_log /dev/null crit;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
