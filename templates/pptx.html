<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} · PowerPoint</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080e18;color:#edf3fb;font:14px system-ui,sans-serif}main{position:fixed;inset:60px 0 120px;display:grid;place-items:center;padding:12px}#slide{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 10px 60px #0005}#slide[hidden]{display:none}#status{text-align:center;color:#b7c8de;max-width:560px;line-height:1.6}
</style></head><body><main><p id="status" role="status">Preparing PowerPoint preview…<br>The first view may take a moment.</p><img id="slide" alt="" hidden></main><script>
const manifest={{ manifest|tojson }},prefix=manifest.slice(0,-'manifest'.length),status=document.querySelector('#status'),image=document.querySelector('#slide');let count=0,current=0;
function go(n){if(!count)return;current=Math.max(0,Math.min(count-1,n));image.src=prefix+`page-${current+1}.jpg`;image.alt=`Slide ${current+1} of ${count}`;history.replaceState(null,'','#'+(current+1));dispatchEvent(new Event('slides-change'))}
window.slidesDeck={version:1,getState:()=>({index:current,count}),go,get titles(){return Array.from({length:count},(_,i)=>`Slide ${i+1}`)},get thumbnails(){return Array.from({length:count},(_,i)=>prefix+`page-${i+1}.jpg`)},download:{{ download|tojson }},resize:({top,bottom})=>{const stage=document.querySelector('main');stage.style.top=top+'px';stage.style.bottom=bottom+'px'}};
async function load(){try{const r=await fetch(manifest,{credentials:'same-origin'});if(!r.ok&&r.status!==202)throw Error();const data=await r.json();if(data.status==='processing'){setTimeout(load,1500);return}if(data.status!=='ready'||!Number.isInteger(data.pages)||data.pages<1||data.pages>10000){status.textContent=data.message||'Preview unavailable. Download the original PowerPoint from the library.';return}count=data.pages;status.hidden=true;image.hidden=false;go((parseInt(location.hash.slice(1),10)||1)-1)}catch{status.textContent='Preview unavailable. Refresh to retry, or download the original PowerPoint from the library.'}}
load();
</script><script src="{{ url_for('slide_navigation') }}"></script><script src="{{ url_for('presentation_channel') }}"></script></body></html>
