<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} · PowerPoint</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080e18;color:#edf3fb;font:14px system-ui,sans-serif}header{position:fixed;inset:0 0 auto 240px;height:54px;display:flex;align-items:center;gap:15px;padding:8px 15px;border-bottom:1px solid #30425b;background:#111d30;z-index:5}button,a{font:600 13px system-ui,sans-serif;color:#d9f8f4;background:#21354d;border:1px solid #405875;border-radius:7px;padding:8px 12px;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #7de0ce;outline-offset:2px}header .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#b7c8de}aside{position:fixed;inset:0 auto 0 0;width:240px;background:#111b2c;overflow-y:auto;border-right:1px solid #30425b;z-index:7;padding:12px}aside h2{font-size:14px;margin:5px 0 15px}.thumb{display:block;width:100%;margin:12px 0;padding:7px;text-align:left;background:#17263b;border:2px solid transparent}.thumb[aria-current=true]{border-color:#7de0ce}.thumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#080e18}.thumb span{display:block;font-size:12px;margin-top:6px}main{position:fixed;inset:54px 0 0 240px;display:grid;place-items:center;padding:24px 24px 64px}#slide{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 10px 60px #0005}#slide[hidden]{display:none}#status{text-align:center;color:#b7c8de;max-width:560px;line-height:1.6}footer{position:fixed;bottom:0;right:8px;z-index:4;display:flex;align-items:center;gap:10px;padding:18px 8px 8px;background:linear-gradient(transparent,#080e18aa);transition:opacity .18s}footer button{padding:7px 12px}#counter{min-width:58px;text-align:center}.closed aside{display:none}.closed header{left:0}.closed main{left:0}@media(hover:hover) and (pointer:fine){footer{opacity:0}footer:hover,footer:has(:focus-visible){opacity:1}}@media(max-width:899px){header{left:0}main{left:0;padding:12px 12px 65px}aside{box-shadow:10px 0 50px #000a;top:54px}header .title{display:none}header a{margin-left:auto;font-size:12px}main img{width:100%}}
@media(prefers-reduced-motion:reduce){footer{transition:none}}</style></head><body><header><button id="toggle" aria-controls="thumbnails" aria-expanded="true">☰ Slides</button><span class="title">{{ title }}</span><a id="download-pptx" href="{{ download }}" download>Download PPTX ↓</a></header><aside id="thumbnails" aria-label="Slide thumbnails"><h2>PowerPoint slides</h2><div id="thumbs"></div></aside><main><p id="status" role="status">Preparing PowerPoint preview…<br>The first view may take a moment.</p><img id="slide" alt="" hidden></main><footer aria-label="Playback controls"><button id="prev" aria-label="Previous slide">←</button><span id="counter">—</span><button id="next" aria-label="Next slide">→</button><button id="fullscreen">Full screen</button></footer><script>
const manifest={{ manifest|tojson }},prefix=manifest.slice(0,-'manifest'.length),status=document.querySelector('#status'),image=document.querySelector('#slide');let count=0,current=0;
if(innerWidth<900)document.body.classList.add('closed');function syncDrawer(){document.querySelector('#toggle').setAttribute('aria-expanded',String(!document.body.classList.contains('closed')))}syncDrawer();document.querySelector('#toggle').onclick=()=>{document.body.classList.toggle('closed');syncDrawer()};
function go(n){if(!count)return;current=Math.max(0,Math.min(count-1,n));image.src=prefix+`page-${current+1}.jpg`;image.alt=`Slide ${current+1} of ${count}`;document.querySelector('#counter').textContent=`${current+1} / ${count}`;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===count-1;document.querySelectorAll('.thumb').forEach((b,i)=>b.setAttribute('aria-current',String(i===current)));history.replaceState(null,'','#'+(current+1))}
document.querySelector('#prev').onclick=()=>go(current-1);document.querySelector('#next').onclick=()=>go(current+1);document.querySelector('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(current+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(count-1)});
async function load(){try{const r=await fetch(manifest,{credentials:'same-origin'});if(!r.ok&&r.status!==202)throw Error();const data=await r.json();if(data.status==='processing'){setTimeout(load,1500);return}if(data.status!=='ready'){status.textContent=data.message||'Preview unavailable. Download the original PowerPoint above.';return}count=data.pages;document.querySelector('#thumbs').replaceChildren();for(let i=0;i<count;i++){const button=document.createElement('button');button.className='thumb';button.setAttribute('aria-label',`Slide ${i+1}`);const img=document.createElement('img');img.src=prefix+`page-${i+1}.jpg`;img.alt='';img.loading='lazy';const label=document.createElement('span');label.textContent=`Slide ${i+1}`;button.append(img,label);button.onclick=()=>{go(i);if(innerWidth<900){document.body.classList.add('closed');syncDrawer()}};document.querySelector('#thumbs').append(button)}status.hidden=true;image.hidden=false;go((parseInt(location.hash.slice(1),10)||1)-1)}catch{status.textContent='Preview unavailable. Refresh to retry, or download the original PowerPoint above.'}}
load();
</script><script src="{{ url_for('presentation_channel') }}"></script></body></html>
