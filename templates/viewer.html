<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} · Slides</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#101825;color:#edf2ff;font:14px system-ui,sans-serif}body{display:flex;flex-direction:column}nav{display:flex;align-items:center;gap:18px;padding:9px 18px;min-height:46px;background:#111c2e;border-bottom:1px solid #324158}a{color:#7de0ce;text-decoration:none;font-weight:650}a:focus-visible{outline:3px solid #7de0ce;outline-offset:3px}.title{color:#a1b2cd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}iframe{display:block;width:100%;flex:1;min-height:0;border:0}.format-switch{display:flex;gap:4px;align-items:center}.format-switch a{color:#a8bdd6;padding:7px 10px;border-radius:6px;border:1px solid transparent;font-size:12px;min-height:44px;display:inline-flex;align-items:center}.format-switch a[aria-current=page]{color:#7de0ce;border-color:#486377;background:#23394c}.download-format{font-size:12px;min-height:44px;display:inline-flex;align-items:center}@media(max-width:760px){nav{flex-wrap:wrap;gap:9px;padding:8px 12px}.title{flex-basis:45%}.format-switch{margin-left:auto}}
</style></head><body><nav aria-label="Presentation navigation"><span class="title">{{ title }}</span>{% if formats %}<div class="format-switch" aria-label="Presentation format"><a class="format-link" href="{{ formats.html }}" {% if active_format=='html' %}aria-current="page"{% endif %}>HTML</a><a class="format-link" href="{{ formats.pptx }}" {% if active_format=='pptx' %}aria-current="page"{% endif %}>PowerPoint</a></div>{% if active_format=='html' %}<a class="download-format" href="{{ formats.download_pptx }}" download>Download PPTX ↓</a>{% endif %}{% endif %}</nav><iframe src="{{ source }}" title="{{ title }} presentation" allow="fullscreen" allowfullscreen></iframe><script>
const frame=document.querySelector('iframe');if(location.hash)frame.src+=location.hash;frame.addEventListener('load',()=>{const sync=()=>{try{history.replaceState(null,'',location.pathname+location.search+frame.contentWindow.location.hash)}catch{}};try{frame.contentWindow.addEventListener('hashchange',sync);sync()}catch{}});
document.querySelectorAll('.format-link').forEach(link=>link.addEventListener('click',()=>{try{const hash=frame.contentWindow.location.hash;if(/^#\d+$/.test(hash))link.href=link.href.split('#')[0]+hash}catch{}}));
</script></body></html>
