<style>
.folder-row summary{grid-template-columns:20px 140px minmax(0,1fr) auto}.deck-preview{display:grid;place-items:center;position:relative;width:140px;aspect-ratio:16/9;background:#0b1425;border:1px solid #294157;border-radius:8px;overflow:hidden}.deck-preview img{width:100%;height:100%;object-fit:contain;z-index:1}.deck-preview img:not([src]){visibility:hidden}.preview-fallback{position:absolute;color:var(--muted);font-size:13px}.folder-content{padding-left:22px}.tag-filter-list,.tag-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tag-filter,.tag-chip{background:#172b3c;color:var(--muted);border:1px solid #355167;border-radius:22px;padding:8px 14px;font-size:13px}.tag-filter{min-height:44px}.tag-chip{padding:3px 10px;margin-top:12px}.tag-filter[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:#203d40}.tag-editor{padding:0 0 18px}.tag-editor label{margin:8px 0}.tag-edit-fields{display:flex;gap:10px}.tag-edit-fields input{min-width:0;flex:1}.tag-edit-fields button{white-space:nowrap}.tag-management{margin-bottom:15px;color:var(--muted)}.tag-management summary{cursor:pointer;min-height:44px}.tag-management form{max-width:500px;padding:16px;background:#142338;border-radius:12px}.tag-management .preference-controls{margin-top:18px}.history-link{color:var(--accent);display:inline-flex;align-items:center;min-height:44px;font-size:14px}.pill-options{display:flex;flex-wrap:wrap;gap:6px;border:0;padding:0;margin:0;min-width:0}.pill-options legend{font-size:12px;color:var(--muted);margin-bottom:6px}.pill-options label{position:relative;margin:0;cursor:pointer}.pill-options input{position:absolute;width:1px;height:1px;opacity:0}.pill-options span{display:flex;align-items:center;justify-content:center;min-height:44px;padding:8px 12px;background:#0b1425;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:13px}.pill-options input:checked+span{color:var(--accent);border-color:#4b897e;background:#203d40}.pill-options input:focus-visible+span{outline:3px solid var(--accent);outline-offset:3px}.share-form{align-items:end}.share-form button{min-height:44px}@media(max-width:800px){.folder-row summary{grid-template-columns:16px 90px minmax(0,1fr);gap:10px}.deck-preview{width:90px}.folder-formats{grid-column:3}.folder-content{padding:0 14px 18px}.share-form{display:flex;flex-direction:column;align-items:stretch}.share-form button{width:100%}.tag-edit-fields{flex-wrap:wrap}.tag-edit-fields input{flex-basis:100%}.tag-edit-fields button{width:100%}}@media(max-width:400px){.folder-row summary{grid-template-columns:12px 70px minmax(0,1fr);gap:8px}.deck-preview{width:70px}.folder-title{overflow-wrap:anywhere}.top{gap:12px}.top>a:not(.brand){font-size:12px}}
</style>
<script>
const selectedTags=new Set();try{JSON.parse(localStorage.getItem('slides-library-tags')||'[]').forEach(tag=>selectedTags.add(tag))}catch{}
const originalFilterFolders=filterFolders;
filterFolders=function(){originalFilterFolders();rows.forEach(row=>{const tags=JSON.parse(row.dataset.tags||'[]');if([...selectedTags].some(tag=>!tags.includes(tag)))row.hidden=true});document.querySelector('#empty').style.display=rows.some(row=>!row.hidden)?'none':'block'};
function renderTagFilters(){const box=document.querySelector('#tag-filters');box.replaceChildren();const available=[...new Set(rows.flatMap(row=>JSON.parse(row.dataset.tags||'[]')))];[...selectedTags].forEach(tag=>{if(!available.includes(tag))selectedTags.delete(tag)});available.sort(names.compare).forEach(tag=>{const button=document.createElement('button');button.type='button';button.className='tag-filter';button.textContent=tag;button.dataset.tag=tag;button.setAttribute('aria-pressed',String(selectedTags.has(tag)));button.onclick=()=>{if(selectedTags.has(tag))selectedTags.delete(tag);else selectedTags.add(tag);button.setAttribute('aria-pressed',String(selectedTags.has(tag)));try{localStorage.setItem('slides-library-tags',JSON.stringify([...selectedTags]))}catch{}filterFolders()};box.append(button)});filterFolders()}
renderTagFilters();
document.querySelectorAll('.tag-editor').forEach(form=>form.onsubmit=async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;try{const response=await fetch(form.action,{method:'POST',body:new FormData(form)});if(!response.ok||response.redirected)throw Error();const result=await response.json(),row=form.closest('.folder-row');row.dataset.tags=JSON.stringify(result.tags);form.elements.tags.value=result.tags.join(', ');const chips=row.querySelector('.tag-chips');chips.replaceChildren();result.tags.forEach(tag=>{const chip=document.createElement('span');chip.className='tag-chip';chip.textContent=tag;chips.append(chip)});renderTagFilters();preferenceStatus.textContent='Tags saved.'}catch{preferenceStatus.textContent='Could not save tags. Use up to 20 tags, each 1–48 characters, and check your session.'}finally{button.disabled=false}});
const previewObserver=new IntersectionObserver(items=>items.forEach(item=>{if(!item.isIntersecting)return;previewObserver.unobserve(item.target);loadPreview(item.target)}),{rootMargin:'160px'});
async function loadPreview(img,attempt=0){try{const response=await fetch(img.dataset.thumbnail);if(!response.ok||response.redirected)return;const pending=response.headers.get('X-Preview-State')==='processing';const old=img.src;img.src=URL.createObjectURL(await response.blob());if(old.startsWith('blob:'))URL.revokeObjectURL(old);if(pending&&attempt<25)setTimeout(()=>loadPreview(img,attempt+1),2000)}catch{}}
document.querySelectorAll('[data-thumbnail]').forEach(img=>previewObserver.observe(img));
</script>
